<app-layout [userRole]="userRole" [userName]="userName">
  <div class="dashboard">
    <h1>Dashboard Gestionnaire d'Entrepôt</h1>
    <p>Bienvenue sur votre tableau de bord</p>

    <div class="dashboard-cards">
      <div class="card">
        <h3>Entrepôts</h3>
        <button routerLink="/warehouses">Gérer les entrepôts</button>
      </div>

      <div class="card">
        <h3>Inventaires</h3>
        <button routerLink="/inventories">Voir les inventaires</button>
      </div>
    </div>
  </div>
</app-layout>
