<div class="auth-page">
  <div class="auth-container">
    <!-- Logo / Header -->
    <div class="auth-header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
        <h1>StockFlow</h1>
      </div>
      <p class="subtitle">Bienvenue ! Connectez-vous à votre compte</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="error" class="alert alert-error">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      {{ error }}
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onLogin()" class="auth-form" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="loginData.email"
          placeholder="Entrez votre email"
          required
          email
          class="form-control"
          [disabled]="loading"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="loginData.password"
          placeholder="Entrez votre mot de passe"
          required
          class="form-control"
          [disabled]="loading"
          autocomplete="current-password"
        />
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" />
          <span>Se souvenir de moi</span>
        </label>
        <a href="#" class="forgot-password">Mot de passe oublié ?</a>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading || !loginForm.valid">
        <span *ngIf="loading" class="spinner-small"></span>
        <span *ngIf="!loading">Se connecter</span>
      </button>
    </form>

    <!-- Footer -->
    <div class="auth-footer">
      <a routerLink="/home" class="link-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Retour à l'accueil
      </a>
    </div>
  </div>
</div>
